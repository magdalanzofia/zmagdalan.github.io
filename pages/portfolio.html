            'Obszar%20kompozycji%2054.jpg',
            'Obszar%20kompozycji%2055.jpg',
            'Obszar%20kompozycji%2056.jpg',
            'Obszar%20kompozycji%2057.jpg',
            'Obszar%20kompozycji%2058.jpg',
            'Obszar%20kompozycji%2059.jpg',
            'Obszar%20kompozycji%2060.jpg'
        ];

        const IMG_DIR = '../portfolio%20jpg-2/web/';
        const FLIP_MS = 800;
        const totalPages = allImages.length;
        const totalPairs = Math.ceil(totalPages / 2);
        let currentPair = 0;
        let isFlipping = false;

        const leftEl = document.getElementById('left-page');
        const rightEl = document.getElementById('right-page');
        const leaf = document.getElementById('leaf');
        const leafFront = document.getElementById('leaf-front');
        const leafBack = document.getElementById('leaf-back');

        // Obiekty Image trzymamy w pamięci, żeby zdekodowane zdjęcia nie znikały między obrotami
        const cache = [];
        function load(idx) {
            if (idx < 0 || idx >= totalPages) return Promise.resolve();
            if (!cache[idx]) {
                const img = new Image();
                img.src = IMG_DIR + allImages[idx];
                cache[idx] = img.decode().catch(() => {}).then(() => img);
            }
            return cache[idx];
        }

        function preloadAround() {
            for (let p = currentPair - 1; p <= currentPair + 2; p++) {
                load(p * 2);
                load(p * 2 + 1);
            }
        }

        function setImg(el, idx) {
            const ok = idx >= 0 && idx < totalPages;
            el.style.backgroundImage = ok ? `url('${IMG_DIR}${allImages[idx]}')` : 'none';
            el.style.setProperty('--dy', ok ? (PAGE_OFFSETS[idx] || 0) : 0);
        }

        function showCounter() {
            const start = currentPair * 2 + 1;
            const end = Math.min(start + 1, totalPages);
            document.getElementById('current-page').textContent = `${start}-${end}`;
        }

        function setLeafAngle(deg, animated) {
            leaf.style.transition = animated ? `transform ${FLIP_MS}ms ease-in-out` : 'none';
            leaf.style.transform = `rotateY(${deg}deg)`;
        }

        function render() {
            setImg(leftEl, currentPair * 2);
            setImg(rightEl, currentPair * 2 + 1);
            setImg(leafFront, currentPair * 2 + 1);
            setLeafAngle(0, false);
            showCounter();
        }

        // Podmiana stron dopiero po faktycznym końcu animacji, żeby nic nie przeskakiwało
        function afterFlip(done) {
            let finished = false;
            const finish = () => {
                if (finished) return;
                finished = true;
                leaf.removeEventListener('transitionend', onEnd);
                done();
            };
            const onEnd = (e) => {
                if (e.target === leaf && e.propertyName === 'transform') finish();
            };
            leaf.addEventListener('transitionend', onEnd);
            setTimeout(finish, FLIP_MS + 200);
        }

        // Kartka: przód = obecna prawa strona, tył = następna lewa strona
        async function nextPair() {
            if (currentPair >= totalPairs - 1 || isFlipping) return;
            isFlipping = true;

            const nextLeft = (currentPair + 1) * 2;
            await Promise.all([load(nextLeft), load(nextLeft + 1)]);
            setImg(rightEl, nextLeft + 1);   // odsłaniana spod kartki
            setImg(leafBack, nextLeft);      // ląduje na lewej stronie

            void leaf.offsetWidth;
            setLeafAngle(-180, true);

            afterFlip(() => {
                currentPair++;
                render();
                isFlipping = false;
                preloadAround();
            });
        }

        // Kartka startuje na lewej stronie (tył = obecna lewa) i wraca na prawą (przód = poprzednia prawa)
        async function prevPair() {
            if (currentPair <= 0 || isFlipping) return;
            isFlipping = true;

            const prevLeft = (currentPair - 1) * 2;
            await Promise.all([load(prevLeft), load(prevLeft + 1)]);
            setImg(leftEl, prevLeft);        // odsłaniana spod kartki
            setImg(leafBack, currentPair * 2);
            setImg(leafFront, prevLeft + 1);

            setLeafAngle(-180, false);
            void leaf.offsetWidth;
            setLeafAngle(0, true);

            afterFlip(() => {
                currentPair--;
                render();
                isFlipping = false;
                preloadAround();
            });
        }

        leaf.addEventListener('click', nextPair);
        rightEl.addEventListener('click', nextPair);
        leftEl.addEventListener('click', prevPair);

        // Proporcje strony z pierwszego zdjęcia, żeby wszystkie kartki miały ten sam format
        const book = document.getElementById('book');

        const probe = new Image();
        probe.onload = () => {
            book.style.setProperty('--page-ratio', (probe.naturalWidth / probe.naturalHeight).toFixed(4));
        };
        probe.src = IMG_DIR + allImages[0];

        new ResizeObserver(() => book.style.setProperty('--page-h', book.clientHeight + 'px')).observe(book);

        preloadAround();
        render();
    </script>
</body>
